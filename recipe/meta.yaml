{% set name = "edgetest-hub" %}
{% set version = "2026.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 0bf5c532c7ca0dc7a6b9991063908deac6a898c94952bf553d9a72ca325b8009

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install -vv --no-deps .

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=64.0.0
  run:
    - edgetest >=2021.12.3
    - git
    - hub
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - edgetest_hub.plugin

about:
  home: https://github.com/capitalone/edgetest-hub
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: edgetest-hub is a hub plugin for edgetest
  description: |
    This plugin allows users to create virtual environments using conda instead of venv when using edgetest
  doc_url: https://capitalone.github.io/edgetest-hub
  dev_url: https://github.com/capitalone/edgetest-hub

extra:
  recipe-maintainers:
    - jdawang
    - gladysteh99
    - NikhilJArora
    - fdosani
    - ak-gupta
